  snyk-security-scan:
    name: Escaneo de Vulnerabilidades con Snyk
    runs-on: ubuntu-latest
    # Este job puede correr en paralelo, pero lo mantenemos con 'needs' para orden:
    needs: [build-and-test] 

    steps:
      - name: Checkout del Codigo
        uses: actions/checkout@v4

      # ---------------------------------------------------------------------
      # A. Escaneo de Dependencias (requirements.txt)
      # ---------------------------------------------------------------------
      - name: Snyk Test (Dependencias Python)
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{f6b16f56-754d-4d90-97fe-46f4850a3172}} # El secreto de GitHub que acabas de crear
        with:
          # Escanea dependencias de requirements.txt
          command: test
          args: --file=requirements.txt

      # ---------------------------------------------------------------------
      # B. Escaneo de la Imagen Docker Base
      # ---------------------------------------------------------------------
      - name: Snyk Test (Imagen Docker)
        uses: snyk/actions/docker@master
        env:
          SNYK_TOKEN: ${{f6b16f56-754d-4d90-97fe-46f4850a3172}}
        with:
          # Esta es la imagen base que usaste en la ETAPA 2 (PRODUCTION) de tu Dockerfile
          image: python:3.11-alpine 
          args: --file=Dockerfile